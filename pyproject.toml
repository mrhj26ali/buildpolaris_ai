[project]
name = "buildpolaris-ai"
version = "2.0.0"
description = "AI sidecar service for the BuildPolaris construction project management platform"
readme = "README.md"
authors = [
    { name = "Ali Mrhj", email = "mrhj26ali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # --- Core Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Database & Retrieval ---
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "apache-age-python>=0.0.7",
    "redis>=5.0.0",
    "hiredis>=3.0.0",
    # --- LLM & AI ---
    "instructor>=1.5.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "groq>=0.11.0",
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    # --- MCP ---
    "mcp>=1.0.0",
    # --- Document Processing ---
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "unstructured>=0.15.0",
    # --- Auth & Security ---
    "pyjwt[crypto]>=2.9.0",
    # --- Resilience & Observability ---
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # --- Utilities ---
    "httpx>=0.27.0",
    "uuid7>=0.1.0",
    "faker>=28.0.0",
    "pyyaml>=6.0.0",
    # --- Testing ---
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.0.0",
    "ragas>=0.2.0",
    "bandit>=1.7.0",
    "ruff>=0.6.0",
    "pip-audit>=2.7.0",
    "google-genai>=2.18.0",
]

[project.scripts]
buildpolaris-ai = "buildpolaris_ai.main:run"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no external dependencies",
    "integration: requires containerized Postgres+AGE+pgvector",
    "security: adversarial-input and boundary tests",
    "eval: golden-set quality evaluations",
    "load: load and performance tests",
    "e2e: end-to-end tests against live components",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/buildpolaris_ai"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[dependency-groups]
dev = ["locust>=2.30.0"]
