[project]
name = "buildpolaris-ai"
version = "2.1.0"
description = "BuildPolaris AI sidecar â€” hexagonal microkernel over a derived retrieval platform (ARCH v2.1 Â§3.3, Â§6.3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "google-genai>=0.3.0",
    "sentence-transformers>=3.2.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.2",
    "mcp>=1.1.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
# Only needed if a tenant is pinned to one of the extensibility-slot
# adapters (app/platform/model_provider/anthropic_adapter.py,
# openai_adapter.py) â€” neither is imported unless actually selected via
# MODEL_PROVIDER__PRIMARY or MODEL_PROVIDER__FALLBACK, so these are not
# in the base dependency set.
extended-providers = [
    "anthropic>=0.39.0",
    "openai>=1.54.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
