services:
  polaris-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: polaris_ai_db
    environment:
      POSTGRES_USER: polaris_ai
      POSTGRES_PASSWORD: polaris_ai_dev_password
      POSTGRES_DB: polaris_knowledge
    ports:
      - "5432:5432"
    volumes:
      - polaris_db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris_ai -d polaris_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 5

  polaris-redis:
    image: redis:7-alpine
    container_name: polaris_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - polaris_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  polaris_db_data:
  polaris_redis_data: